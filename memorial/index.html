<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141614">
  <meta name="description" content="In remembrance of those who have died in ICE custory.">
  <title>In Remembrance — ICE Detention Memorial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <link href="styles.css?v=ca0e7c1ca94b" rel="stylesheet">
  <script src="data.js" defer></script>
  <script src="timeline.js" defer></script>
  <script src="app.js?v=7c849f1e2806" defer></script>
</head>
<body>
  <a href="#names" class="skip-link">Skip to the names</a>
  <main>
    <section class="introduction" aria-labelledby="page-title">
      <h1 id="page-title">In Remembrance</h1>
      <p class="intro-copy"><span>of those who have died in ICE detention</span><span id="subtitle-since">since January 1, 2024</span></p>
    </section>
    <section class="memorial" aria-label="Names of people in the supplied records">
      <ul class="name-wall" id="names" tabindex="-1"></ul>
      <noscript><p class="no-script">Please enable JavaScript to display the names and their records.</p></noscript>
      <div class="earlier-controls" id="earlier-controls" hidden>
        <button class="earlier-button" id="load-earlier" type="button" aria-controls="names" aria-describedby="earlier-range">See more</button>
        <p class="earlier-range" id="earlier-range"></p>
      </div>
      <p class="sr-only" id="load-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </section>
  </main>
  <footer><p class="footer-summary"><span id="record-count">297 Deaths in ICE Detention</span> <span id="footer-since">Since October 7, 2003</span></p><p class="footer-attribution">Data from the <a href="https://detentionmortality.com">ICE Detention Mortality Dashboard</a>.</p></footer>
  <aside class="record-card hover-card" id="hover-card" aria-label="Record preview" hidden></aside>
  <dialog id="record-dialog" class="record-dialog" aria-labelledby="record-name">
    <form method="dialog"><button class="close-button" aria-label="Close record">×</button></form>
    <div id="record-content"></div>
    <p class="record-footnote">From the supplied detention death records.</p>
  </dialog>
</body>
</html>
