name: Update memorial data

on:
  schedule:
    - cron: '23 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-memorial-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test CSV conversion
        run: python3 -B -m unittest discover -s scripts -p 'test_memorial_data.py'
      - name: Rebuild memorial data
        run: python3 scripts/build-memorial-data.py
      - name: Open or update data pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-memorial-data
          delete-branch: true
          add-paths: memorial/data.js
          commit-message: Update memorial data from Detention Mortality Dashboard
          title: Update memorial data
          body: |
            Regenerates `memorial/data.js` from https://detentionmortality.com/detainee_deaths_data.csv.

            Review additions, corrections, and removals before merging. The memorial will use the updated records after the merged change is deployed.
